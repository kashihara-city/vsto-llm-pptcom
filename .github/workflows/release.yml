# Pushing a tag v* builds the release MSI on a GitHub-hosted runner: the parser tests, then
# scripts/build/build.ps1. Run by hand (workflow_dispatch) it does the same for the current commit.
# Tests that need PowerPoint (ComScriptRunner against a real deck) are run on a development PC
# before the tag; the runners have no Office.
#
# Not here yet: attestation, an SBOM, publishing a GitHub Release, and a signing certificate the
# organization trusts. Until then the VSTO manifests are signed with a certificate made on the
# runner for that run only (the MSI trusts whatever key signed them), so no secret is needed and
# the MSI is a test build.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build the MSI
    # One image for every release: the PIAs and the VSTO tools come from the image's Visual Studio,
    # and they differ between images (windows-2022's Visual Studio 2022 and windows-2025's Visual
    # Studio 2026 ship differently signed copies of the same PIAs), so the MSI does too. The image
    # itself still updates weekly; the toolchain step records which one built it.
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          "Image: $env:ImageOS $env:ImageVersion"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property displayName
          & $vswhere -latest -products * -property installationVersion
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          "MSBuild: $msbuild"
          & $msbuild -version -nologo
          "MSBUILD=$msbuild" >> $env:GITHUB_ENV
          dotnet --version

      - name: Check that nothing secret is tracked
        shell: pwsh
        run: |
          # Private addresses, internal host names, API keys, a developer's paths, keys and certificates.
          # (The deny list of our own host and model names stays on the developers' machines.)
          $ErrorActionPreference = "Stop"
          python -X utf8 scripts/test/no-secrets.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "no-secrets self-test failed" }
          python -X utf8 scripts/test/no-secrets.py
          if ($LASTEXITCODE -ne 0) { throw "a tracked file names a host, a path or a secret" }

      - name: Install the Rust toolchain that builds anydoc
        shell: pwsh
        run: |
          # The add-in build turns anydoc's pinned source (deps\anydoc.tar.gz) into WebAssembly with this
          # toolchain (pptcom\WebVendor.ps1); deps\web-sources.lock.json names it.
          $ErrorActionPreference = "Stop"
          $rust = (Get-Content -LiteralPath "deps/web-sources.lock.json" -Raw | ConvertFrom-Json).rust
          rustup toolchain install $rust.toolchain --profile minimal --target $rust.target
          if ($LASTEXITCODE -ne 0) { throw "rustup failed" }
          rustup run $rust.toolchain rustc --version

      - name: Verify the tag matches the committed versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagMatch = [regex]::Match($env:TAG_NAME, '^v(?<version>\d+\.\d+\.\d+)$')
          if (-not $tagMatch.Success) { throw "Tag '$($env:TAG_NAME)' must have the form v1.2.3." }
          $version = $tagMatch.Groups["version"].Value
          [xml]$proj = Get-Content -LiteralPath "pptcom/pptcom.csproj" -Raw
          $appVersion = ($proj.Project.PropertyGroup | ForEach-Object { $_.ApplicationVersion } | Where-Object { $_ } | Select-Object -First 1)
          $info = Get-Content -LiteralPath "pptcom/Properties/AssemblyInfo.cs" -Raw
          $asmVersion = [regex]::Match($info, 'AssemblyVersion\("(?<v>[^"]+)"\)').Groups["v"].Value
          $fileVersion = [regex]::Match($info, 'AssemblyFileVersion\("(?<v>[^"]+)"\)').Groups["v"].Value
          $expected = "$version.0"
          if ($appVersion -ne $expected -or $asmVersion -ne $expected -or $fileVersion -ne $expected) {
            throw "Tag does not match committed versions (tag=$version, ApplicationVersion=$appVersion, AssemblyVersion=$asmVersion, AssemblyFileVersion=$fileVersion)."
          }
          "Version $version"

      - name: Install the VSTO runtime when the image lacks it
        shell: pwsh
        run: |
          # The VSTO build tasks (VerifyClickOnceSigningSettings) load
          # Microsoft.VisualStudio.Tools.Applications.Hosting from the GAC, where the VSTO runtime puts it.
          # windows-2025 (Visual Studio 2026) has no VSTO runtime; windows-2022 had one.
          $ErrorActionPreference = "Stop"
          $gac = "$env:windir\Microsoft.NET\assembly\GAC_MSIL\Microsoft.VisualStudio.Tools.Applications.Hosting"
          if (Test-Path $gac) { "The VSTO runtime is already there"; exit 0 }
          $setup = "$env:RUNNER_TEMP\vstor_redist.exe"
          # The link Visual Studio's ClickOnce bootstrapper uses for the VSTO runtime (Packages\VSTOR40).
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?LinkId=158918" -OutFile $setup -UseBasicParsing
          $hash = (Get-FileHash $setup).Hash.ToUpperInvariant()
          $version = (Get-Item $setup).VersionInfo.ProductVersion
          "vstor_redist.exe {0:N1} MB, version {1}, SHA256 {2}" -f ((Get-Item $setup).Length / 1MB), $version, $hash
          $signature = Get-AuthenticodeSignature -FilePath $setup
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "CN=Microsoft Corporation,") {
            throw "vstor_redist.exe signature: $($signature.Status), signer $($signature.SignerCertificate.Subject)"
          }
          "signature valid, signer $($signature.SignerCertificate.Subject)"
          # Pinned by hash. When the link has moved to a newer installer, the signature above says whether
          # it is genuine; then its version is looked at and the hash here changed on purpose.
          $pinned = "CFE1A40BBE4A50022DB2164ABDB0154984E2CECB761A23CDC81CB5754F6E0A18"  # 10.0.60917
          if ($hash -ne $pinned) { throw "vstor_redist.exe is not the pinned installer: SHA256 $hash (version $version), pinned $pinned" }
          $p = Start-Process -FilePath $setup -ArgumentList "/q", "/norestart" -Wait -PassThru
          "vstor_redist.exe exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vstor_redist.exe failed" }
          if (-not (Test-Path $gac)) { throw "The VSTO runtime was installed but Hosting is not in the GAC" }

      - name: Check the Office PIAs the build compiles against
        shell: pwsh
        run: |
          # OfficePia.props takes them from Visual Studio's Office workload. The add-in compiles against them
          # but does not ship them (Office has the same ones in the GAC); the parser tests and ComScriptRunner
          # copy them next to themselves.
          $ErrorActionPreference = "Stop"
          $dir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Shared\Visual Studio Tools for Office\PIA\Office15"
          foreach ($name in "Microsoft.Office.Interop.PowerPoint.dll", "Office.dll", "Microsoft.Vbe.Interop.dll") {
            $f = Join-Path $dir $name
            if (-not (Test-Path $f)) { throw "Missing: $f" }
            $signature = Get-AuthenticodeSignature -FilePath $f
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "CN=Microsoft Corporation,") {
              throw "$name signature: $($signature.Status), signer $($signature.SignerCertificate.Subject)"
            }
            "{0}  {1}  SHA256={2}" -f $name, ([Reflection.AssemblyName]::GetAssemblyName($f).Version), (Get-FileHash $f).Hash
          }

      - name: Make a throwaway signing certificate
        shell: pwsh
        run: |
          # VSTO signs its ClickOnce manifests; the build stops without pptcom\signing.local.props.
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate -Subject "CN=pptcom CI test build" -Type CodeSigningCert `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(7)
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          "::add-mask::$password"
          $pfx = Join-Path $env:GITHUB_WORKSPACE "pptcom\ci-signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          $props = @"
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <PropertyGroup>
              <SignManifests>true</SignManifests>
              <ManifestKeyFile>ci-signing.pfx</ManifestKeyFile>
              <ManifestCertificateThumbprint>$($cert.Thumbprint)</ManifestCertificateThumbprint>
              <ManifestPassword>$password</ManifestPassword>
            </PropertyGroup>
          </Project>
          "@
          Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "pptcom\signing.local.props") -Value $props -Encoding utf8
          "thumbprint $($cert.Thumbprint)"

      - name: Build and run the parser tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:MSBUILD scripts\test\ComScriptTests\ComScriptTests.csproj -restore -p:Configuration=Debug -p:Platform=AnyCPU -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "ComScriptTests build failed" }
          scripts\test\ComScriptTests\bin\Debug\ComScriptTests.exe
          if ($LASTEXITCODE -ne 0) { throw "parser tests failed" }

      - name: Build ComScriptRunner
        shell: pwsh
        run: |
          & $env:MSBUILD scripts\test\ComScriptRunner\ComScriptRunner.csproj -restore -p:Configuration=Debug -p:Platform=AnyCPU -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "ComScriptRunner build failed" }

      - name: Build the MSI
        id: msi
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # build.ps1 builds the add-in (Release) itself; restore its NuGet packages first.
          & $env:MSBUILD pptcom\pptcom.csproj -t:Restore -p:Configuration=Release -p:Platform=AnyCPU -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed" }
          Get-ChildItem pptcom\bin\Release -File | ForEach-Object { "{0,-55} {1,10:N0}" -f $_.Name, $_.Length }
          $msi = Get-ChildItem release -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "No MSI in release\" }
          $hash = (Get-FileHash $msi.FullName).Hash.ToLowerInvariant()
          "{0}  {1:N0} bytes  SHA256={2}" -f $msi.Name, $msi.Length, $hash
          "$hash  $($msi.Name)" | Set-Content -LiteralPath "$($msi.FullName).sha256" -Encoding ascii

      - name: Keep the MSI
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-${{ github.ref_name }}
          path: |
            release/*.msi
            release/*.msi.sha256
          if-no-files-found: warn
