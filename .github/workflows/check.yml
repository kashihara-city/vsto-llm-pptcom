# Checks every push to main and every pull request (and runs by hand: gh workflow run check.yml): the checks and
# builds of release.yml, without the MSI, the attestations and the Release, which stay there with their write
# permissions.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, build and test
    # The same image as release.yml (see there).
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that nothing secret is tracked
        shell: pwsh
        run: |
          # Private addresses, internal host names, API keys, a developer's paths, keys and certificates.
          # (The deny list of our own host and model names stays on the developers' machines.)
          $ErrorActionPreference = "Stop"
          python -X utf8 scripts/test/no-secrets.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "no-secrets self-test failed" }
          python -X utf8 scripts/test/no-secrets.py
          if ($LASTEXITCODE -ne 0) { throw "a tracked file names a host, a path or a secret" }

      - name: Check the task pane's language files
        shell: pwsh
        run: |
          # Every code the add-in and the page use is in locales\ja.json with matching placeholders, and the
          # other languages have the same codes; no Japanese text is written in the code itself.
          python -X utf8 scripts/test/i18n.py
          if ($LASTEXITCODE -ne 0) { throw "the language files do not match the code" }

      - name: Check the task pane's JavaScript
        shell: pwsh
        run: |
          # The page's own scripts parse (node --check); the vendor/ copies are not checked.
          python -X utf8 scripts/test/js-syntax.py
          if ($LASTEXITCODE -ne 0) { throw "a script of the task pane does not parse" }

      - name: Prepare the build
        # MSBuild, Rust, the VSTO runtime, the PIAs and a throwaway signing certificate: .github/actions/build-setup.
        uses: ./.github/actions/build-setup

      - name: Build and run the parser tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:MSBUILD scripts\test\ComScriptTests\ComScriptTests.csproj -restore -p:Configuration=Debug -p:Platform=AnyCPU -nologo -v:minimal "-flp:logfile=$env:RUNNER_TEMP\tests.log;warningsonly"
          if ($LASTEXITCODE -ne 0) { throw "ComScriptTests build failed" }
          scripts\test\ComScriptTests\bin\Debug\ComScriptTests.exe
          if ($LASTEXITCODE -ne 0) { throw "parser tests failed" }

      - name: Build and run the chat stream tests
        shell: pwsh
        run: |
          # How a reply's stream is read (whole replies, tool calls in pieces, failures, 中止 and the idle limit),
          # against a server on the loopback address; no LLM is called.
          $ErrorActionPreference = "Stop"
          & $env:MSBUILD scripts\test\ChatStreamTests\ChatStreamTests.csproj -restore -p:Configuration=Debug -p:Platform=AnyCPU -nologo -v:minimal "-flp:logfile=$env:RUNNER_TEMP\stream.log;warningsonly"
          if ($LASTEXITCODE -ne 0) { throw "ChatStreamTests build failed" }
          scripts\test\ChatStreamTests\bin\Debug\ChatStreamTests.exe
          if ($LASTEXITCODE -ne 0) { throw "chat stream tests failed" }

      - name: Check the NetAnalyzers rule list
        shell: pwsh
        run: |
          # deps\analyzers\netanalyzers-all.globalconfig must be the list of the restored package
          # (Directory.Build.props pins its version; scripts/deps/netanalyzers-config.py writes the list).
          python -X utf8 scripts/deps/netanalyzers-config.py --check
          if ($LASTEXITCODE -ne 0) { throw "the NetAnalyzers rule list is not the pinned package's" }

      - name: Build ComScriptRunner
        shell: pwsh
        run: |
          & $env:MSBUILD scripts\test\ComScriptRunner\ComScriptRunner.csproj -restore -p:Configuration=Debug -p:Platform=AnyCPU -nologo -v:minimal "-flp:logfile=$env:RUNNER_TEMP\runner.log;warningsonly"
          if ($LASTEXITCODE -ne 0) { throw "ComScriptRunner build failed" }

      - name: Build the add-in
        shell: pwsh
        run: |
          # Debug, as a developer builds it (build.ps1 builds Release for the MSI in release.yml).
          & $env:MSBUILD pptcom\pptcom.csproj -restore -p:Configuration=Debug -p:Platform=AnyCPU -nologo -v:minimal "-flp:logfile=$env:RUNNER_TEMP\addin.log;warningsonly"
          if ($LASTEXITCODE -ne 0) { throw "add-in build failed" }

      - name: Check the build warnings
        shell: pwsh
        run: |
          # Warnings are errors, except CS8032 (an analyzer that cannot be created) for the one known analyzer:
          # another one would be an analyzer whose rules silently stopped running.
          python -X utf8 scripts/test/build-warnings.py "$env:RUNNER_TEMP\tests.log" "$env:RUNNER_TEMP\stream.log" "$env:RUNNER_TEMP\runner.log" "$env:RUNNER_TEMP\addin.log"
          if ($LASTEXITCODE -ne 0) { throw "a build had a warning other than the known CS8032" }
